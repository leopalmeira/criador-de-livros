services:
  - type: web
    name: book-engin-kdp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=420"
      - key: VITE_CONFIG_NATIVE_IGNORE_WARNING
        value: "true"
